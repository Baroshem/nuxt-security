name: ci

on:
  push:
    branches:
      - 'main'
      - '**-rc.**'
      - 'renovate/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24, 26]

    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cache node_modules
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ matrix.os }}-node-v${{ matrix.node }}-deps-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --non-interactive

      - name: Dependency audit
        run: yarn audit --level moderate

      - name: Lint
        run: yarn lint

      - name: Prepare
        run: yarn dev:prepare

      - name: Test
        run: yarn test --maxWorkers=2

      - name: Package
        run: yarn prepack

  compatibility:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['16381:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:16381
      NUXT_SECURITY_DIST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install independent dependency graphs
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn --cwd docs install --frozen-lockfile --non-interactive
          yarn --cwd compat/nitro3 install --frozen-lockfile --non-interactive
          yarn playwright install --with-deps chromium
      - name: Audit independent dependency graphs
        run: |
          yarn --cwd docs audit --level moderate
          yarn --cwd compat/nitro3 audit --level moderate
      - name: Build package and compatibility fixtures
        run: |
          yarn dev:prepare
          yarn prepack
          yarn --cwd compat/nitro3 build
          yarn --cwd docs build
          node compat/clean-deployments.mjs
          yarn nuxi build compat/deployments --preset vercel
          yarn nuxi build compat/deployments --preset cloudflare-module
          NUXT_SECURITY_OUTPUT=.output-bun yarn nuxi build compat/deployments --preset bun
      - name: Browser, native Nitro 3, Redis processes and deployment runtimes
        run: yarn test:compat
